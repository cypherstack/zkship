services:
  zkb-relay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ZKB_PORT:-8080}:8080"
    environment:
      ZKB_BIND_ADDR: "0.0.0.0:8080"
      ZKB_ALLOWED_ORIGINS: "${ZKB_ALLOWED_ORIGINS:-*}"
      ZKB_TRUST_PROXY: "${ZKB_TRUST_PROXY:-0}"
      ZKB_MAX_ROOMS: "${ZKB_MAX_ROOMS:-4096}"
      ZKB_MAX_CONNS_PER_IP: "${ZKB_MAX_CONNS_PER_IP:-32}"
      ZKB_ROOM_CREATE_PER_MIN: "${ZKB_ROOM_CREATE_PER_MIN:-60}"
      ZKB_VERIFY_PER_MIN: "${ZKB_VERIFY_PER_MIN:-30}"
      ZKB_MAX_CONCURRENT_VERIFICATIONS: "${ZKB_MAX_CONCURRENT_VERIFICATIONS:-2}"
      ZKB_WAITING_TTL_SECS: "${ZKB_WAITING_TTL_SECS:-600}"
      ZKB_RECONNECT_GRACE_SECS: "${ZKB_RECONNECT_GRACE_SECS:-120}"
      ZKB_TURN_TIMEOUT_SECS: "${ZKB_TURN_TIMEOUT_SECS:-300}"
      ZKB_FINISHED_TTL_SECS: "${ZKB_FINISHED_TTL_SECS:-1800}"
      RUST_LOG: "${RUST_LOG:-info}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
